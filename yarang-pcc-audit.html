      // Export Functions (UTF-8 BOM supported for Microsoft Excel)
      const exportQueueToCSV = () => {
        const headers = ["Booking ID", "Queue No", "Clinic", "Patient Name", "CID", "Phone", "Date", "Session", "Slot/Type", "Services", "Status", "Type", "Note"];
        const rows = bookings.map(b => [
          b.id, b.queueNo, `"${b.clinicName}"`, `"${b.patientName}"`, `"${b.cid || ''}"`, `"${b.phone}"`,
          b.date, b.session, `"${b.slotTime}"`, `"${(b.selectedServices || []).join(', ')}"`, b.status, b.type, `"${b.note || ''}"`
        ]);
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        downloadCSV(csvContent, `yarang_pcc_queue_report_${new Date().toISOString().split('T')[0]}.csv`);
        logAction(role, 'EXPORT_QUEUE_CSV', 'ส่งออกรายงานตารางคิวประจำวันเป็น CSV');

      const exportAuditLogsToCSV = () => {

        downloadCSV(csvContent, `yarang_pcc_audit_logs_${new Date().toISOString().split('T')[0]}.csv`);

      };

      const downloadCSV = (content, filename) => {
        const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

          const lines = evt.target.result.split('\n').slice(1);
          let count = 0;
          const newBks = [];
          lines.forEach((line, idx) => {
            if (!line.trim()) return;
            const cols = line.split(',');
            const pName = cols[0]?.replace(/"/g, '').trim() || `ผู้ป่วย MyPCU ${idx+1}`;
            const phone = cols[1]?.replace(/"/g, '').trim() || '0800000000';
            newBks.push({
              id: `BK-PCU-${Date.now().toString().slice(-3)}-${idx}`,
              queueNo: `GEN-M${String(idx+1).padStart(3, '0')}`,
              clinicId: 'general',

              cid: 'นำเข้า MyPCU',

              date: new Date().toISOString().split('T')[0],

              status: 'confirmed',

        const queueSummary = JSON.stringify(bookings.map(b => ({ queue: b.queueNo, clinic: b.clinicName, name: b.patientName, status: b.status, time: b.slotTime })));

        const payload = {
          contents: [{ parts: [{ text: `Queue Database Snapshot: ${queueSummary}\nOfficer Question: ${userText}` }] }],
          systemInstruction: { parts: [{ text: "You are an AI queue assistant for officers at รพ.สต.ยะรัง. Answer officer queries accurately and concisely in polite Thai using the provided database snapshot." }] }

        try {

      const generateClinicSlots = (clinicObj, session) => {
        if (!clinicObj || clinicObj.fifo) return [];
        const slots = [];
        const startHour = session === 'AM' ? 8 : 13;
        const startMinute = session === 'AM' ? 30 : 0;
        const endHour = session === 'AM' ? 12 : 16;
        const duration = clinicObj.slotMinutes || 15;
        let current = startHour * 60 + startMinute;
        const end = endHour * 60;

        while (current + duration <= end) {
          const sh = Math.floor(current / 60); const sm = current % 60;
          const eh = Math.floor((current + duration) / 60); const em = (current + duration) % 60;
          slots.push(`${String(sh).padStart(2, '0')}:${String(sm).padStart(2, '0')} - ${String(eh).padStart(2, '0')}:${String(em).padStart(2, '0')}`);
          current += duration;
        }
        return slots;
      };

                        <th className="p-3">Log ID</th>
                        <th className="p-3">Timestamp</th>
                        <th className="p-3">User/Role</th>
                        <th className="p-3">Action</th>
                        <th className="p-3">Details</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {auditLogs.map(log => (
                        <tr key={log.id} className="hover:bg-slate-50">
                          <td className="p-3 font-bold text-teal-800">{log.id}</td>
                          <td className="p-3 text-slate-500">{log.time}</td>
                          <td className="p-3 font-bold text-slate-700">{log.user}</td>
                          <td className="p-3"><span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded font-bold">{log.action}</span></td>
                          <td className="p-3 text-slate-800">{log.details}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* GEMINI 2.5 MOBILE AI ASSISTANT CHAT */}
            {((role === 'officer' && isOfficerAuthed) || (role === 'admin' && isAdminAuthed)) && activeTab === 'officer-chat' && (
              <div className="max-w-3xl mx-auto bg-white rounded-2xl border shadow-md flex flex-col h-[550px] overflow-hidden">
                <div className="bg-slate-900 text-white p-4 flex justify-between items-center">
                  <h3 className="font-bold text-sm">🤖 Gemini 2.5 Flash Mobile Queue Assistant</h3>
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded">Mobile Active</span>
                </div>
                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[80%] rounded-2xl px-4 py-2.5 ${msg.sender === 'user' ? 'bg-teal-700 text-white' : 'bg-white border text-slate-800 shadow-xs'}`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {isChatLoading && <div className="text-slate-400 text-xs">Gemini กำลังวิเคราะห์ข้อมูลคิว...</div>}
                  <div ref={chatEndRef} />
                </div>
                <form onSubmit={handleSendGeminiChat} className="p-3 bg-white border-t flex gap-2">
                  <input type="text" placeholder="ถามข้อมูลคิว เช่น วันนี้ทันตกรรมมีกี่คิว?..." value={inputMessage} onChange={(e) => setInputMessage(e.target.value)} className="flex-1 text-xs p-2.5 border rounded-xl" />
                  <button type="submit" disabled={isChatLoading} className="bg-amber-500 text-slate-900 font-bold px-4 rounded-xl text-xs">ถาม AI</button>
                </form>
              </div>
            )}

          </main>

          {/* EMERGENCY MODAL */}
          {showEmergencyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 border-2 border-rose-600 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-base text-rose-700">⚠️ คำเตือนอาการป่วยฉุกเฉินวิกฤต (Red Flags)</h3>
                  <button onClick={() => setShowEmergencyModal(false)} className="text-slate-400 p-1">✕</button>
                </div>
                <div className="text-xs text-slate-700 space-y-2">
                  <p className="font-bold text-rose-800">หากท่านมีอาการดังต่อไปนี้ **กรุณาอย่ารอคิวจองออนไลน์**:</p>
                  <ul className="list-disc pl-5 font-medium space-y-1">
                    <li>แน่นหน้าอก เจ็บหน้าอกรุนแรง ร้าวไปแขน/คาง</li>
                    <li>หายใจหอบเหนื่อยรุนแรง หายใจติดขัด</li>
                    <li>แขนขาอ่อนแรง ปากเบี้ยว พูดไม่ชัด ทันทีทันใด (Stroke)</li>
                    <li>ไข้สูงซึมในเด็กเล็ก หรือชักเกร็ง</li>
                  </ul>
                </div>
                <a href="tel:1669" className="w-full bg-rose-600 text-white font-extrabold py-3 rounded-xl text-xs flex justify-center">📞 โทร 1669 เรียกรถพยาบาลทันที</a>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-10">
            <div className="max-w-6xl mx-auto px-4 text-center sm:text-left">
              <p className="font-bold text-slate-200">โรงพยาบาลส่งเสริมสุขภาพตำบลยะรัง (รพ.สต.ยะรัง)</p>
              <p className="text-[11px] text-slate-500">อำเภอยะรัง จังหวัดปัตตานี — PCC Queue & Matrix System</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

<!-- ===== Nav Active State ===== -->
<script>
(function() {
  const current = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-link').forEach(a => {
    const href = a.getAttribute('href');
    if (href === current || (current === 'index.html' && href === 'index.html')) {
      a.classList.add('active');
    }
  });
})();
</script></body>
</html>

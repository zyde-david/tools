<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}}</title>

  <!-- ===== Design Tokens ===== -->
  <style>
    :root {
      /* ---- Color: Brand ---- */
      --tool-brand: #6366f1;
      --tool-brand-hover: #4f46e5;
      --tool-brand-light: #e0e7ff;
      --tool-brand-text: #312e81;
      --tool-brand-text-light: #a5b4fc;

      /* ---- Color: Semantic ---- */
      --tool-success: #22c55e;
      --tool-success-hover: #16a34a;
      --tool-warn: #f59e0b;
      --tool-warn-hover: #d97706;
      --tool-danger: #ef4444;
      --tool-danger-hover: #dc2626;
      --tool-info: #38bdf8;
      --tool-info-hover: #0ea5e9;

      /* ---- Color: Base (Dark Default) ---- */
      --bg-base: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --bg-hover: #475569;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
      --border-focus: #6366f1;
      --border-light: #475569;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 28px rgba(0,0,0,0.5);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 9999px;
      --transition: 150ms ease;
      --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --print-bg: #ffffff;
      --print-text: #0f172a;
      --nav-height: 56px;        /* Bottom bar height on mobile */
      --nav-width: 260px;        /* Sidebar width on desktop */
    }

    /* ---- Light Mode Override ---- */
    html.light {
      --bg-base: #f8fafc;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-hover: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --border-focus: #6366f1;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 28px rgba(0,0,0,0.12);
      --print-bg: #ffffff;
      --print-text: #0f172a;
    }

    /* ---- Base Reset ---- */
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--tool-brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; display: block; }

    /* ---- Skip Link ---- */
    .skip-link {
      position: absolute; top: -100%; left: 1rem;
      background: var(--tool-brand); color: white;
      padding: 0.5rem 1rem; border-radius: var(--radius-md);
      z-index: var(--z-toast);
      transition: top var(--transition);
    }
    .skip-link:focus { top: 1rem; }

    /* ============================================================
       RESPONSIVE NAVIGATION
       Mobile: Fixed bottom bar (position: fixed, bottom: 0)
       Desktop (>= 768px): Fixed left sidebar (position: fixed, left: 0, height: 100vh)
       ============================================================ */
    .tools-nav {
      position: fixed;
      z-index: var(--z-nav);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem;
      backdrop-filter: blur(8px);
      /* Mobile: bottom bar */
      bottom: 0;
      left: 0;
      right: 0;
      top: auto;
      height: var(--nav-height);
      justify-content: space-around;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border-bottom: none;
      box-shadow: var(--shadow-lg);
    }

    .tools-nav .nav-home,
    .tools-nav .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-md);
      font-size: 1.25rem;
      min-width: 44px;
      min-height: 44px;
      transition: all var(--transition);
      flex: 1;
    }
    .tools-nav .nav-home span,
    .tools-nav .nav-link span {
      display: none; /* Hide labels on mobile bottom bar */
      font-size: 0.625rem;
      margin-top: 0.125rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .tools-nav .nav-home:hover,
    .tools-nav .nav-link:hover {
      color: var(--text-primary);
      background: var(--bg-elevated);
      transform: scale(1.1);
      text-decoration: none;
    }
    .tools-nav .nav-link.active {
      color: var(--tool-brand);
      background: var(--tool-brand-light);
    }

    /* Desktop: Left Sidebar */
    @media (min-width: 768px) {
      .tools-nav {
        top: 0;
        bottom: 0;
        left: 0;
        right: auto;
        width: var(--nav-width);
        height: 100vh;
        flex-direction: column;
        justify-content: flex-start;
        padding: 1rem 0.5rem;
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
        border-right: 1px solid var(--border-color);
        border-bottom: none;
        box-shadow: var(--shadow-md);
        overflow-y: auto;
        gap: 0.25rem;
      }
      .tools-nav .nav-home,
      .tools-nav .nav-link {
        flex-direction: row;
        gap: 0.75rem;
        justify-content: flex-start;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        min-width: auto;
        min-height: auto;
        width: 100%;
        border-radius: var(--radius-md);
      }
      .tools-nav .nav-home span,
      .tools-nav .nav-link span {
        display: inline;
      }
      .tools-nav .nav-home:hover,
      .tools-nav .nav-link:hover {
        transform: none;
        background: var(--bg-elevated);
      }
      .tools-nav .nav-link.active {
        background: var(--tool-brand-light);
        color: var(--tool-brand-text);
      }
      .tools-nav .nav-sep {
        display: none;
      }
      .tools-nav .nav-title {
        display: none;
      }
    }

    /* Adjust main content for nav */
    .tool-main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
      padding-bottom: calc(var(--nav-height) + 1.5rem); /* Mobile: space for bottom bar */
    }
    @media (min-width: 768px) {
      .tool-main {
        margin-left: var(--nav-width);
        max-width: calc(1200px - var(--nav-width));
        padding-bottom: 1.5rem;
      }
    }
    @media (max-width: 640px) {
      .tool-main { padding: 1rem; padding-bottom: calc(var(--nav-height) + 1rem); }
    }

    /* ---- Footer ---- */
    .tool-footer { border-top: 1px solid var(--border-color); }

    /* ---- Toast Container ---- */
    .toast-container { position: fixed; bottom: calc(var(--nav-height) + 1.5rem); right: 1.5rem; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
    @media (min-width: 768px) {
      .toast-container { bottom: 1.5rem; right: calc(var(--nav-width) + 1.5rem); }
    }

    /* ===== CHILD: INJECT EXTRA <link> / <style> HERE ===== */
    {{HEAD_EXTRAS}}

    <!-- ===== Auth Guard (Runs Before Body Render) ===== -->
    <script>
      (function() {
        const authKey = 'zyde_auth';
        const loginUrl = 'index.html';
        if (typeof window.SKIP_AUTH === 'undefined' && !sessionStorage.getItem(authKey)) {
          const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.href = loginUrl + '?return=' + returnUrl;
        }
      })();
    </script>
</head>
<body>

  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

  <!-- ===== Responsive Navigation ===== -->
  <nav class="tools-nav" role="navigation" aria-label="เครื่องมือนำทาง">
    <a href="index.html" class="nav-home" title="หน้าหลัก" aria-label="หน้าหลัก">🏠<span>หน้าหลัก</span></a>
    {{NAV_LINKS}}
  </nav>

  <!-- ===== Main Content ===== -->
  <main id="main-content" class="tool-main" role="main">
    {{CONTENT}}
  </main>

  <!-- ===== Footer (Optional) ===== -->
  <footer class="tool-footer" style="padding:1.5rem; text-align:center; color:var(--text-muted); font-size:0.75rem; border-top:1px solid var(--border-color); margin-top:auto;">
    {{FOOTER_CONTENT}}
  </footer>

  <!-- ===== Toast Container (Global) ===== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ===== Global Scripts ===== -->
  <script>
    // ===== Toast System =====
    window.toast = (message, type = 'info', duration = 4000) => {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `alert alert-${type}`;
      el.style.cssText = 'pointer-events:auto; min-width:240px; max-width:360px; box-shadow:var(--shadow-lg); animation:slideIn 0.3s ease;';
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => { el.style.animation = 'slideOut 0.3s ease forwards'; setTimeout(() => el.remove(), 300); }, duration);
    };
    // Toast animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
      @keyframes slideOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(100%); } }
    `;
    document.head.appendChild(style);

    // ===== Modal Helpers =====
    window.openModal = (id) => { const m = document.getElementById(id); if (m) m.classList.add('open'); };
    window.closeModal = (id) => { const m = document.getElementById(id); if (m) m.classList.remove('open'); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open')); });
    document.addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('open'); });

    // ===== Auth Helpers =====
    window.requireAuth = () => {
      if (!sessionStorage.getItem('zyde_auth')) {
        const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.href = 'index.html?return=' + returnUrl;
        return false;
      }
      return true;
    };
    window.logout = () => { sessionStorage.removeItem('zyde_auth'); window.location.href = 'index.html'; };

    // ===== Nav Active State =====
    (function() {
      const current = window.location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-link').forEach(a => {
        const href = a.getAttribute('href');
        if (href === current || (current === 'index.html' && href === 'index.html')) {
          a.classList.add('active');
        }
      });
    })();
  </script>

  <!-- ===== CHILD: INJECT PAGE-SPECIFIC SCRIPTS HERE ===== -->
  {{FOOTER_SCRIPTS}}
</body>
</html>

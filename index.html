<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Zyde's Toolbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }
        
        /* === Login Screen === */
        #loginScreen {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            max-width: 90vw;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        #loginScreen h1 { text-align: center; font-size: 1.8rem; margin-bottom: 4px; color: #f1f5f9; }
        #loginScreen p.sub { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-bottom: 24px; }
        .logo-icon { font-size: 3rem; text-align: center; display: block; margin-bottom: 12px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 1rem; outline: none; transition: border 0.2s; }
        .input-group input:focus { border-color: #6366f1; }
        .btn-login { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #4f46e5; }
        .error-msg { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 12px; display: none; }

        /* === Dashboard === */
        #dashboard { display: none; width: 100%; max-width: 1000px; padding: 20px; }
        
        .dash-topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30,41,59,0.8); backdrop-filter: blur(12px);
            border: 1px solid #334155; border-radius: 12px;
            padding: 14px 20px; margin-bottom: 24px;
        }
        .dash-topbar h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
        .dash-topbar .right { display: flex; gap: 8px; align-items: center; }
        .dash-topbar .tool-count { background: #312e81; color: #a5b4fc; font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
        .btn-logout { padding: 8px 16px; background: #334155; color: #94a3b8; border: 1px solid #475569; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-logout:hover { background: #ef4444; color: white; border-color: #ef4444; }

        /* Sticky search header */
        .dash-sticky {
            position: sticky; top: 0; z-index: 50;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding-top: 12px;
            margin-bottom: 14px;
        }
        /* Auth status in search section */
        .auth-status-search {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 16px; margin-bottom: 8px;
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            font-size: 0.8rem;
        }
        .auth-status-search .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #94a3b8; flex-shrink: 0; }
        .auth-status-search .name { color: #cbd5e1; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .auth-status-search .btn-auth { padding: 2px 10px; border-radius: 4px; border: none; background: #334155; color: #e2e8f0; font-size: 0.7rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .auth-status-search .btn-auth:hover { background: #475569; }

        /* Search + filter bar */
        .search-bar {
            background: #1e293b; border: 1px solid #334155; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 20px;
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1; min-width: 150px;
            padding: 10px 14px; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; color: #e2e8f0; font-size: 0.9rem; outline: none;
        }
        .search-bar input:focus { border-color: #6366f1; }
        .search-bar input::placeholder { color: #475569; }

        /* Category tabs */
        .cat-tabs {
            display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px;
        }
        .cat-tab {
            padding: 6px 14px; background: #1e293b; border: 1px solid #334155;
            border-radius: 999px; font-size: 0.8rem; cursor: pointer;
            color: #94a3b8; transition: all 0.2s; font-weight: 600;
        }
        .cat-tab:hover { border-color: #6366f1; color: #e2e8f0; }
        .cat-tab.active { background: #312e81; border-color: #6366f1; color: #a5b4fc; }

        /* Tool Grid */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .tool-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 18px; text-decoration: none; color: #e2e8f0;
            transition: all 0.2s; display: block; cursor: pointer;
        }
        .tool-card:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.12);
        }
        .tool-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
        .tool-card h2 { font-size: 0.95rem; margin-bottom: 4px; line-height: 1.3; }
        .tool-card p { color: #94a3b8; font-size: 0.78rem; line-height: 1.4; }
        .tool-tag {
            display: inline-block; padding: 3px 8px; background: #312e81;
            color: #a5b4fc; border-radius: 999px; font-size: 0.65rem;
            font-weight: 600; margin-top: 8px;
        }
        .tool-hidden { display: none !important; }

        @media (max-width: 640px) {
            #dashboard { padding: 8px; }
            .tool-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .tool-card { padding: 14px; }
            .tool-card h2 { font-size: 0.85rem; }
            .dash-topbar { flex-wrap: wrap; gap: 8px; }
            .dash-topbar h1 { font-size: 1rem; }
            .dash-sticky { padding-top: 6px; }
            .auth-status-search { padding: 4px 10px; font-size: 0.7rem; margin-bottom: 4px; }
            .search-bar { padding: 8px 10px; }
            .cat-tabs { margin-bottom: 12px; }
        }
    </style>
<script src="firebase-auth.js"></script>
<script src="tools-auth-injector.js"></script>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
    <span class="logo-icon">🔐</span>
    <h1>Zyde's Toolbox</h1>
    <p class="sub">กรุณาใส่รหัสผ่านเพื่อเข้าใช้เครื่องมือทั้งหมด</p>
    <div class="input-group">
        <label>รหัสผ่าน</label>
        <input type="password" id="passwordInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkPassword()">
    </div>
    <button class="btn-login" onclick="checkPassword()">เข้าสู่ระบบ</button>
    <div style="text-align:center;margin:12px 0;color:#475569;font-size:0.8rem;">— หรือ —</div>
    <button class="btn-login" id="googleSignInBtn" style="background:#fff;color:#1e293b;border:1px solid #475569;display:flex;align-items:center;justify-content:center;gap:8px;" onclick="signInWithGoogleIndex()">
        <svg style="width:18px;height:18px;" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
        <span>เข้าสู่ระบบด้วย Google Account</span>
    </button>
    <div class="error-msg" id="errorMsg">❌ รหัสผ่านไม่ถูกต้อง</div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard">

    <!-- Sticky Header -->
    <div class="dash-sticky">

    <!-- Top Bar -->
    <div class="dash-topbar">
        <h1>🛠️ Zyde's Toolbox <span class="tool-count" id="toolCount">7</span></h1>
        <div class="right">
            <button onclick="logout()" class="btn-logout">🚪 ออกจากระบบ</button>
        </div>
    </div>

    <!-- Auth Status -->
    <div class="auth-status-search" id="authStatusSearch">
        <span class="dot" id="authDotSearch"></span>
        <span class="name" id="authNameSearch">Cloud Sync</span>
        <button class="btn-auth" id="authBtnSearch" onclick="toggleAuthSearch()">Login</button>
    </div>

    <!-- Search -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 ค้นหาเครื่องมือ..." oninput="filterTools()">
        <span style="color:#475569; font-size:0.75rem;" id="searchResultCount">7 รายการ</span>
    </div>

    <!-- Category Tabs -->
    <div class="cat-tabs" id="categoryTabs">
        <span class="cat-tab active" data-cat="all" onclick="setCategory('all')">🔧 ทั้งหมด</span>
    </div>

    </div><!-- /dash-sticky -->

    <!-- Tool Grid -->
    <div class="tool-grid" id="toolGrid"></div>
</div>

<script>
    const PASSWORD_HASH = '88077ce624e416d49dde93dbd5e8babee964f30a6f76fef2e0482a3969316526';
    const OWNER_EMAIL = 'zodas13031@gmail.com';
    let currentCategory = 'all';

    const tools = [
        { icon: '🏆', name: 'ระบบสร้างเกียรติบัตรวิชาชีพ (Interactive Certificate Builder)', desc: 'ปรับแต่งรายส่วนอิสระ + นำเข้า Excel จำนวนมาก + รองรับไทย/อังกฤษ/อาหรับ/ยาวี + พิมพ์ A4 แนวนอน 1 หน้าถ้วน', tag: 'Certificate Builder', file: 'interactive-certificate-builder.html', cat: 'เกียรติบัตร' },
        { icon: '✉️', name: 'ระบบพิมพ์ซองจดหมาย', desc: 'พิมพ์ซอง DL + TSP route + Google Maps', tag: 'Envelope Printer', file: 'envelope-printer.html', cat: 'พิมพ์' },
        { icon: '⌨️', name: 'เครื่องมือสร้างสคริปต์ AHK', desc: 'AutoHotkey generator สำหรับคีย์ข้อมูล รพ.', tag: 'AHK Generator', file: 'autocorrect.html', cat: 'คีย์ข้อมูล' },
        { icon: '📊', name: 'ศูนย์จัดการทะเบียนพิกัดระบาดวิทยา', desc: 'GPS cluster + Multipin/Heatmap + CSV', tag: 'Epidemiology Map', file: 'map-epidemic.html', cat: 'แผนที่' },
        { icon: '🦫', name: 'MyPCU Hyper Bulk Decoder', desc: 'ถอดรหัส Base64 คอลัมน์ต่างดาว รองรับ 20k+ แถว', tag: 'Base64 Decoder', file: 'base64-decoder.html', cat: 'ถอดรหัส' },
        { icon: '🔤', name: 'โปรแกรมกู้คืนภาษาไทยต่างดาว', desc: 'Mojibake Recovery - แก้ UTF-8 หลุด Windows-1252', tag: 'Thai Recovery', file: 'thai-recovery.html', cat: 'ถอดรหัส' },
        { icon: '🖨️', name: 'ระบบวางแผนจัดซื้อน้ำหมึก', desc: 'บริหารฝูงเครื่องพิมพ์ IRL yield + สั่งซื้ออัจฉริยะ', tag: 'Ink Planner', file: 'ink-planner.html', cat: 'พิมพ์' },
        { icon: '📦', name: 'ระบบวิเคราะห์พัสดุคงคลัง', desc: 'นำเข้า Excel + คำนวณมูลค่า + สถานะพัสดุราชการ', tag: 'Inventory Analytics', file: 'inventory-analytics.html', cat: 'พัสดุ' },
        { icon: '🧠', name: 'myPCU SQL Cheatsheet + AI Query Simulator', desc: 'v11.0 - Kid/เด็ก parser fix + Interactive Moo Multi-Select Cards + GIS Map + Prompt Modifier CRUD', tag: 'myPCU AI SQL', file: 'mypcu-sql-cheatsheet-ai.html', cat: 'SQL' },
        { icon: '🏥', name: 'Health GIS Standalone - พิกัดบ้าน อสม. ออฟไลน์ 100%', desc: 'GPS One-button + Auto nearest house + Moo template CSV + Multi-officer JSON merge + Master Excel export', tag: 'Health GIS', file: 'health-gis-app.html', cat: 'แผนที่' },
        { icon: '🎤', name: 'ระบบรายงาน อสม. ด่วน (VHV Voice Report)', desc: 'เสียงเป็นข้อความ + โครงสร้างรายงานอัตโนมัติ + ส่ง LINE/Export + ทำงานออฟไลน์', tag: 'VHV Voice Report', file: 'vhv-quick-report.html', cat: 'รายงาน' },
        { icon: '🏥', name: 'ระบบจองคิว รพ.สต.ยะรัง PCC (Matrix + Audit)', desc: 'Clinic Matrix quotas + FIFO/Timeslot + Manual Issue + Audit Logs + Gemini AI Assistant + Emergency Banner', tag: 'Yarang PCC', file: 'yarang-pcc-audit.html', cat: 'ระบบจองคิว' },
    ];

    function renderCategories() {
        const cats = ['all', ...new Set(tools.map(t => t.cat))];
        const container = document.getElementById('categoryTabs');
        container.innerHTML = cats.map(c => 
            `<span class="cat-tab ${c === currentCategory ? 'active' : ''}" data-cat="${c}" onclick="setCategory('${c}')">${
                c === 'all' ? '🔧 ทั้งหมด' : 
                c === 'พิมพ์' ? '🖨️ พิมพ์' :
                c === 'แผนที่' ? '🗺️ แผนที่' :
                c === 'คีย์ข้อมูล' ? '⌨️ คีย์ข้อมูล' :
                c === 'ถอดรหัส' ? '🔓 ถอดรหัส' :
                c === 'พัสดุ' ? '📦 พัสดุ' :
                c === 'GPS' ? '📍 GPS' :
                c === 'รายงาน' ? '🎤 รายงาน' :
                c === 'ระบบจองคิว' ? '🏥 ระบบจองคิว' : c
            }</span>`
        ).join('');
    }

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.cat === cat);
        });
        filterTools();
    }

    function filterTools() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const filtered = tools.filter(t => {
            const matchCat = currentCategory === 'all' || t.cat === currentCategory;
            const matchSearch = !search || 
                t.name.toLowerCase().includes(search) || 
                t.desc.toLowerCase().includes(search) || 
                t.tag.toLowerCase().includes(search) ||
                t.cat.toLowerCase().includes(search);
            return matchCat && matchSearch;
        });
        document.getElementById('searchResultCount').textContent = filtered.length + ' รายการ';
        renderGrid(filtered);
    }

    function renderGrid(items) {
        const grid = document.getElementById('toolGrid');
        grid.innerHTML = items.map(t => `
            <a class="tool-card" href="${t.file}">
                <span class="tool-icon">${t.icon}</span>
                <h2>${t.name}</h2>
                <p>${t.desc}</p>
                <span class="tool-tag">${t.tag}</span>
            </a>
        `).join('');
    }

    function logout() {
        if (window.TOOLS_FIREBASE && window.TOOLS_FIREBASE.isSignedIn()) {
            window.TOOLS_FIREBASE.signOut();
        }
        localStorage.removeItem('zyde_auth');
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('passwordInput').value = '';
    }

    function showDashboard() {
        localStorage.setItem('zyde_auth', '1');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
    }

    async function signInWithGoogleIndex() {
        var btn = document.getElementById('googleSignInBtn');
        if (!window.TOOLS_FIREBASE || !window.TOOLS_FIREBASE.signInWithGoogle) {
            btn.innerHTML = '<span>กำลังโหลด Firebase...</span>';
            return;
        }
        btn.innerHTML = '<span>กำลังเชื่อมต่อ Google...</span>';
        btn.disabled = true;
        try {
            var result = await window.TOOLS_FIREBASE.signInWithGoogle();
            var user = result.user;
            if (!user || user.email !== OWNER_EMAIL) {
                await window.TOOLS_FIREBASE.signOut();
                btn.innerHTML = '<svg style="width:18px;height:18px" viewBox="0 0 24 24">...</svg><span>เข้าสู่ระบบด้วย Google Account</span>';
                btn.disabled = false;
                document.getElementById('errorMsg').textContent = '❌ เฉพาะ owner เท่านั้น';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }
            showDashboard();
        } catch(e) {
            btn.innerHTML = '<svg style="width:18px;height:18px" viewBox="0 0 24 24">...</svg><span>เข้าสู่ระบบด้วย Google Account</span>';
            btn.disabled = false;
            document.getElementById('errorMsg').textContent = '❌ ' + (e.message || 'ไม่สามารถเข้าสู่ระบบได้');
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    async function sha256(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const hash = await sha256(input);
        if (hash === PASSWORD_HASH) {
            showDashboard();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    // Auto-login: check localStorage or Firebase auth state
    if (localStorage.getItem('zyde_auth') === '1') {
        showDashboard();
    } else if (window.TOOLS_FIREBASE) {
     window.TOOLS_FIREBASE.onAuthChanged(function(user) {
         if (user && localStorage.getItem('zyde_auth') !== '1') {
             // Only allow dashboard access for owner email
             if (user.email === OWNER_EMAIL) {
                 showDashboard();
             } else {
                 window.TOOLS_FIREBASE.signOut();
             }
         }
         // Update auth status in search section
         updateAuthSearchUI(user);
     });
     // Also check if already signed in
     if (window.TOOLS_FIREBASE.isSignedIn()) {
         var curUser = window.TOOLS_FIREBASE.getUser();
         if (curUser && curUser.email === OWNER_EMAIL) {
             showDashboard();
         }
     }
     // Initial auth UI render
     setTimeout(function() { updateAuthSearchUI(window.TOOLS_FIREBASE.getUser()); }, 500);
 }

 function updateAuthSearchUI(user) {
     var dot = document.getElementById('authDotSearch');
     var name = document.getElementById('authNameSearch');
     var btn = document.getElementById('authBtnSearch');
     if (!dot) return;
     if (user) {
         dot.style.background = '#22c55e';
         name.textContent = user.displayName || user.email || user.uid.slice(0,8);
         btn.textContent = 'Logout';
         btn.onclick = function() { window.TOOLS_FIREBASE.signOut(); };
     } else {
         dot.style.background = '#94a3b8';
         name.textContent = 'Cloud Sync';
         btn.textContent = 'Login';
         btn.onclick = toggleAuthSearch;
     }
 }

 function toggleAuthSearch() {
     if (!window.TOOLS_FIREBASE) return;
     if (window.TOOLS_FIREBASE.isSignedIn()) {
         window.TOOLS_FIREBASE.signOut().then(function() {
             updateAuthSearchUI(null);
         });
     } else {
         window.TOOLS_FIREBASE.signInWithGoogle().then(function(result) {
             var user = result.user;
             if (!user || user.email !== OWNER_EMAIL) {
                 window.TOOLS_FIREBASE.signOut();
                 updateAuthSearchUI(null);
                 return;
             }
             updateAuthSearchUI(user);
         }).catch(function(e) {
             document.getElementById('errorMsg').textContent = '❌ ' + (e.message || 'Login failed');
             document.getElementById('errorMsg').style.display = 'block';
         });
     }
 }

    renderCategories();
    filterTools();
    document.getElementById('toolCount').textContent = tools.length;
</script>
</body>
</html>
